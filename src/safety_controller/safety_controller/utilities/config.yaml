vehicle:
  name: Chevy Bolt
  L_F: 1.5213
  L_R: 1.4987
  V_MIN: 0.0
  V_MAX: 10.0
  A_MIN: -2.0
  A_MAX: 0.7
  DF_MIN: -0.3
  DF_MAX: 0.3
  A_DOT_MIN: -1.5
  A_DOT_MAX: 1.5
  DF_DOT_MIN: -0.3
  DF_DOT_MAX: 0.3
  GPS:
    samples: 10
    mean: 0
    std_dev: 0.5


trajectory:
  path: trajectory data/12_09_buckeyelot_striaght.csv
  sample: 0.05
  V_REF: 
  - 10
controller:
# - MPC-DCBF
# - MPC-DCBF-LIE
# - MPC-DCBF-NLIE
# - MPC-HOCBF-QP
- MPC-WB-QP
# - MPC-CBF-QP

dynamics:
- Euler
# - RK2
mpc:
  Qposx: 500
  Qposy: 500
  Qpsi: 100
  Qvel: 500
  R:
    type: diag
    values:
    - 100
    - 50
  N: 7
  DT: 0.1
  LHD: 10
  cbf:
    SAFETY_DIS: 3
    VEHICLE_R: 1.8
    GAMMA: 0.3
    KB: 2
    ALPHA: 7
    LAMBDA: 1
    H:
      type: eye
      values:
      - 1
      - 1
    G:
      values: null


scenarios:
# - name: '1'
#   type: static
#   run_time: 5
#   SAFETY_DIS: 1.5
#   obstacles:
#     - OBSTACLE_R: 2
#       PLACE_DIS: 50
#     # - OBSTACLE_R: 2
#     #   PLACE_DIS: 55


- name: '3'
  type: sudden_ped
  SAFETY_DIS: 3
  run_time: 10
  obstacles:
    - OBSTACLE_R: 1
      PED_VEL: 4.5
      START_POS: [-30, 60]
      SUDDEN_DIS: 15
      END_POS_1: [-60, 90]
      END_POS_2: [-40, 60]


# - name: '3'
#   type: overtaking
#   SAFETY_DIS: 1.5
#   obstacles:
#     - OBSTACLE_R: 2
#       OBS_VEL: 2
#       PLACE_DIS: 20

sensors:

- type: LIDAR
  weight: 0.4
  mean_x: 0
  mean_y: 0
  std_x: 0.4
  std_y: 0.4
  correlation: 0.1
  nu: [2.0, 1.5]
  sigma: [0.5, 0.5]
  scale_laplace: [0.8, 0.8]
  shape_gamma : [9.0, 6.0]
  scale_gamma : [1.0, 1.0]

- type: CAMERA
  weight: 0.4
  mean_x: 0
  mean_y: 0
  std_x: 0.2
  std_y: 0.2
  correlation: 0.1
  nu: [2.0, 1.5]
  sigma: [0.5, 0.5]
  scale_laplace: [0.8, 0.8]
  shape_gamma : [9.0, 6.0]
  scale_gamma : [1.0, 1.0]

- type: V2X
  weight: 0.2
  mean_x: -1.2
  mean_y: -1.5
  std_x: 1.0
  std_y: 0.5
  correlation: 0.1
  nu: [2.0, 1.5]
  sigma: [0.5, 0.5]
  scale_laplace: [0.8, 0.8]
  shape_gamma : [9.0, 6.0]
  scale_gamma : [1.0, 1.0]